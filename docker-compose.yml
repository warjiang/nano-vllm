version: '3.8'

services:
  nano-vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-vllm:latest
    container_name: nano-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/workspace/.cache/huggingface
    volumes:
      # Mount host model directory to container
      - ~/huggingface:/workspace/models:ro
      # Persist HuggingFace cache
      - hf-cache:/workspace/.cache/huggingface
    # Override default command to keep container running
    command: /bin/bash -c "echo 'Nano-vLLM container ready. Run example with: python example.py' && tail -f /dev/null"
    stdin_open: true
    tty: true

volumes:
  hf-cache:
