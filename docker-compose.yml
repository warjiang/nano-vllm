version: '3.8'

# This compose file builds and runs the Docker image locally
# The Qwen3-0.6B model is already included in the image
# To use the pre-built image from GHCR instead, comment out the 'build' section
# and uncomment the 'image' line below:
# image: ghcr.io/warjiang/nano-vllm:latest

services:
  nano-vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-vllm:latest
    container_name: nano-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/workspace/.cache/huggingface
      # Model path is already set in the image, but can be overridden
      - MODEL_PATH=/workspace/models/Qwen3-0.6B
    # Override default command to keep container running
    command: /bin/bash -c "echo 'Nano-vLLM container ready. Run example with: python example.py' && tail -f /dev/null"
    stdin_open: true
    tty: true
